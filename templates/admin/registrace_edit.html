{% extends "admin/base.html" %}
{% block title %}Upravit registraci{% endblock %}

{% block content %}
<div class="flex items-center gap-4 mb-6">
    <a href="{{ url_for('admin_registrace') }}" class="text-gray-500 hover:text-gray-700"><i class="bi bi-arrow-left"></i></a>
    <h1 class="text-2xl font-bold">Upravit registraci</h1>
</div>

<div class="max-w-lg">
    <div class="bg-white rounded-xl shadow p-6 mb-6">
        <h2 class="font-bold mb-3">Registrace</h2>
        <div class="space-y-2 text-sm">
            {% if reg.email %}
            <div class="flex gap-2">
                <span class="text-gray-500 w-20">E-mail:</span>
                <span>{{ reg.email }}</span>
            </div>
            {% endif %}
            {% if reg.phone %}
            <div class="flex gap-2">
                <span class="text-gray-500 w-20">Telefon:</span>
                <span>{{ reg.phone }}</span>
            </div>
            {% endif %}
        </div>
    </div>

    <form method="POST" class="space-y-6">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="bg-white rounded-xl shadow p-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Jméno *</label>
                <input type="text" name="name" id="name" value="{{ reg.name }}" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="px-6 py-3 bg-amber-500 text-gray-900 font-bold rounded-lg hover:bg-amber-400">
                <i class="bi bi-check-lg mr-1"></i> Uložit
            </button>
            <a href="{{ url_for('admin_registrace') }}" class="px-6 py-3 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300">
                Zrušit
            </a>
        </div>
    </form>
</div>
{% endblock %}
