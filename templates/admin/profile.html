{% extends "admin/base.html" %}
{% block title %}Profil{% endblock %}

{% block content %}
<div class="flex items-center gap-4 mb-6">
    <a href="{{ url_for('admin_dashboard') }}" class="text-gray-500 hover:text-gray-700"><i class="bi bi-arrow-left"></i></a>
    <h1 class="text-2xl font-bold">Profil</h1>
</div>

<div class="max-w-lg space-y-6">
    <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="space-y-6">
            <div class="bg-white rounded-xl shadow p-6 space-y-4">
                <h2 class="font-bold">Základní údaje</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Uživatelské jméno</label>
                    <input type="text" value="{{ admin.username }}" disabled
                           class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" name="email" value="{{ admin.email or '' }}"
                           placeholder="vas@email.cz"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                    <p class="text-xs text-gray-500 mt-1">E-mail je potřeba pro obnovení hesla. Bez něj nelze heslo resetovat.</p>
                </div>
            </div>

            <button type="submit" class="px-6 py-3 bg-amber-500 text-gray-900 font-bold rounded-lg hover:bg-amber-400">
                Uložit profil
            </button>
        </div>
    </form>

    <div class="bg-white rounded-xl shadow p-6">
        <h2 class="font-bold mb-3">Zabezpečení</h2>
        <a href="{{ url_for('admin_change_password') }}"
           class="inline-flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200">
            <i class="bi bi-shield-lock"></i> Změnit heslo
        </a>
    </div>
</div>
{% endblock %}
