{% extends "admin/base.html" %}
{% block title %}Změna hesla{% endblock %}

{% block content %}
<div class="flex items-center gap-4 mb-6">
    <a href="{{ url_for('admin_dashboard') }}" class="text-gray-500 hover:text-gray-700"><i class="bi bi-arrow-left"></i></a>
    <h1 class="text-2xl font-bold">Změna hesla</h1>
</div>

<div class="max-w-md">
    <form method="POST" class="space-y-6">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="bg-white rounded-xl shadow p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Současné heslo</label>
                <input type="password" name="current_password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nové heslo</label>
                <input type="password" name="new_password" required minlength="6"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                <p class="text-xs text-gray-500 mt-1">Minimálně 6 znaků</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nové heslo znovu</label>
                <input type="password" name="new_password2" required minlength="6"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
        </div>

        <button type="submit" class="px-6 py-3 bg-amber-500 text-gray-900 font-bold rounded-lg hover:bg-amber-400">
            Změnit heslo
        </button>
    </form>
</div>
{% endblock %}
