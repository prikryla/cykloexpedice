<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení – Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm px-4">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Cykloexpedice" class="h-16 mx-auto">
            <h1 class="text-2xl font-bold text-white mt-4">Administrace</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="p-3 rounded-lg mb-4 {% if category == 'error' %}bg-red-900/50 text-red-300{% else %}bg-green-900/50 text-green-300{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="bg-gray-800 rounded-xl p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Uživatelské jméno</label>
                <input type="text" name="username" required autofocus
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Heslo</label>
                <input type="password" name="password"
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                <p class="text-xs text-gray-500 mt-1">Při prvním přihlášení nechte prázdné – budete vyzváni k nastavení hesla.</p>
            </div>
            <button type="submit"
                    class="w-full py-3 bg-amber-500 text-gray-900 font-bold rounded-lg hover:bg-amber-400">
                Přihlásit se
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('admin_forgot_password') }}" class="text-gray-400 hover:text-white text-sm">
                Zapomenuté heslo?
            </a>
        </div>
    </div>
</body>
</html>
