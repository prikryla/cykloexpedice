{% extends "admin/base.html" %}
{% block title %}{{ 'Upravit ubytování' if item else 'Nové ubytování' }}{% endblock %}

{% block head_extra %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    tinymce.init({
        selector: '.richtext-editor',
        height: 250,
        menubar: false,
        plugins: 'lists link code',
        toolbar: 'undo redo | bold italic underline | bullist numlist | link | code',
        skin_url: 'https://cdn.jsdelivr.net/npm/tinymce@6/skins/ui/oxide',
        content_css: 'https://cdn.jsdelivr.net/npm/tinymce@6/skins/content/default/content.min.css',
        content_style: 'body { font-family: sans-serif; font-size: 16px; }',
    });
});
</script>
{% endblock %}

{% block content %}
<div class="flex items-center gap-4 mb-6">
    <a href="{{ url_for('admin_ubytovani') }}" class="text-gray-500 hover:text-gray-700"><i class="bi bi-arrow-left"></i></a>
    <h1 class="text-2xl font-bold">{{ 'Upravit ubytování' if item else 'Nové ubytování' }}</h1>
</div>

<form method="POST" class="space-y-6">
    <div class="bg-white rounded-xl shadow p-6">
        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Název *</label>
                <input type="text" name="name" required value="{{ item.name if item else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500"
                       placeholder="Penzion Na hrázi">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Město</label>
                <input type="text" name="city" value="{{ item.city if item else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
                <input type="text" name="date" value="{{ item.date if item else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500"
                       placeholder="čtvrtek, 11.09.2025">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Po etapě č.</label>
                <input type="number" name="etapa_number" value="{{ item.etapa_number if item else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Odkaz na web</label>
                <input type="url" name="link" value="{{ item.link if item else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Pořadí</label>
                <input type="number" name="sort_order" value="{{ item.sort_order if item else 0 }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
        </div>
        <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Informace o pokojích</label>
            <textarea name="rooms_info" rows="3"
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">{{ item.rooms_info if item else '' }}</textarea>
        </div>
        <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Informace o stravování</label>
            <textarea name="food_info" class="richtext-editor">{{ item.food_info if item else '' }}</textarea>
        </div>
    </div>

    <div class="flex gap-3">
        <button type="submit" class="px-6 py-3 bg-amber-500 text-gray-900 font-bold rounded-lg hover:bg-amber-400">
            Uložit
        </button>
        <a href="{{ url_for('admin_ubytovani') }}" class="px-6 py-3 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300">
            Zrušit
        </a>
    </div>
</form>
{% endblock %}
