{% extends "base.html" %}
{% block title %}Registrace – Cykloexpedice {{ settings.event_year }}{% endblock %}

{% block content %}
<section class="bg-dark-900 py-16 md:py-20 relative overflow-hidden">
    <div class="relative max-w-6xl mx-auto px-4 text-center">
        <p class="text-olive-500 font-semibold text-sm uppercase tracking-[0.15em] mb-3">Jeďte s námi</p>
        <h1 class="font-display text-5xl md:text-6xl text-white tracking-wide">PŘIHLÁŠENÍ</h1>
        <div class="section-divider mx-auto mt-4"></div>
    </div>
</section>

<section class="py-16 md:py-20">
    <div class="max-w-lg mx-auto px-4">
        <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <div class="h-2 bg-olive-500"></div>
            <div class="p-8 md:p-10">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 rounded-full bg-olive-500/10 flex items-center justify-center mx-auto mb-4">
                        <i class="bi bi-bicycle text-2xl text-olive-500"></i>
                    </div>
                    <p class="text-gray-500 text-sm">
                        Vyplňte formulář a my se vám ozveme s dalšími informacemi o expedici.
                    </p>
                </div>

                <form method="POST" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-dark-900 uppercase tracking-wider mb-2">Jméno a příjmení *</label>
                        <input type="text" name="name" required
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-gold-500 focus:border-gold-500 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-900 uppercase tracking-wider mb-2">E-mail</label>
                        <input type="email" name="email"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-gold-500 focus:border-gold-500 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-900 uppercase tracking-wider mb-2">Telefon</label>
                        <input type="tel" name="phone"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-gold-500 focus:border-gold-500 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-900 uppercase tracking-wider mb-2">Poznámka</label>
                        <textarea name="note" rows="3"
                                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-gold-500 focus:border-gold-500 transition text-sm"></textarea>
                    </div>
                    <button type="submit" class="btn-olive w-full text-center !py-4 text-base">
                        Odeslat přihlášku
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
