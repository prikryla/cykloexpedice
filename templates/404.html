{% extends "base.html" %}
{% block title %}Stránka nenalezena – Cykloexpedice{% endblock %}

{% block content %}
<section class="py-28 md:py-40">
    <div class="max-w-2xl mx-auto px-4 text-center">
        <div class="font-display text-[8rem] md:text-[12rem] leading-none text-gold-500/20 mb-2">404</div>
        <h1 class="font-display text-4xl md:text-5xl text-dark-900 tracking-wide mb-4">STRÁNKA NENALEZENA</h1>
        <div class="section-divider mx-auto mb-6"></div>
        <p class="text-gray-500 text-lg leading-relaxed mb-10">
            Omlouváme se, ale stránka, kterou hledáš, neexistuje nebo není momentálně dostupná.
        </p>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="{{ url_for('index') }}" class="btn-gold text-base !px-10 !py-4">
                <i class="bi bi-house mr-2"></i> Zpět na úvod
            </a>
            <a href="{{ url_for('kontakt') }}" class="btn-outline text-base !px-10 !py-4">
                Kontaktuj nás
            </a>
        </div>
    </div>
</section>
{% endblock %}
