<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obnovení hesla – Cykloexpedice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm mx-4">
        <div class="text-center mb-6">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="" class="h-16 mx-auto mb-3">
            <h1 class="text-xl font-bold text-gray-900">Obnovení hesla</h1>
            <p class="text-sm text-gray-500 mt-2">Zadejte svůj e-mail a my vám zašleme odkaz pro nastavení nového hesla.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="p-3 rounded-lg mb-4 text-sm {% if category == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" class="bg-white rounded-xl shadow p-6 space-y-4">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" name="email" required autofocus
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
            </div>
            <button type="submit"
                    class="w-full py-2.5 bg-amber-500 text-gray-900 font-bold rounded-lg hover:bg-amber-400">
                Odeslat odkaz pro obnovení
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('user_login') }}" class="text-sm text-gray-500 hover:text-amber-600">
                Zpět na přihlášení
            </a>
        </div>
    </div>
</body>
</html>
