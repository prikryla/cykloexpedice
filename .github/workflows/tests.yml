name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libjpeg-turbo8-dev zlib1g-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install --upgrade pip && pip install -r requirements.txt

      - run: pytest test_app.py -v

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          PR_VERSION=$(grep -m1 "^VERSION = " app.py | sed "s/VERSION = '//;s/'//")
          MAIN_VERSION=$(git show origin/main:app.py | grep -m1 "^VERSION = " | sed "s/VERSION = '//;s/'//")
          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::VERSION was not bumped (still $MAIN_VERSION). Update VERSION in app.py before merging."
            exit 1
          fi
          echo "Version bumped: $MAIN_VERSION → $PR_VERSION"
